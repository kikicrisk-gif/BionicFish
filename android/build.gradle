plugins {
    id 'com.android.application' version '9.4.0' apply false
}

project(':app') {
    apply plugin: 'com.android.application'
    // Optional reuse of the unchanged JNI binary from the colleague's v20 APK.
    def reuseVisionBinary = providers.gradleProperty('reuseVisionBinary').map { it.toBoolean() }.getOrElse(false)

    layout.buildDirectory.set(
            rootProject.layout.projectDirectory.dir('build/app')
    )

    android {
        namespace 'com.fish.phonetailtest'
        compileSdk 37
        buildToolsVersion '37.0.0'
        ndkVersion '30.0.16248370'

        defaultConfig {
            applicationId 'com.fish.phonetailtest'
            minSdk 30
            targetSdk 35

            versionCode 1
            versionName '1.0-center-experiment'

            ndk {
                abiFilters 'arm64-v8a'
            }

            if (!reuseVisionBinary) { externalNativeBuild {
                cmake {
                    cppFlags '-std=c++17'
                    arguments '-DANDROID_STL=c++_shared'
                }
            } }
        }

        compileOptions {
            sourceCompatibility JavaVersion.VERSION_17
            targetCompatibility JavaVersion.VERSION_17
        }

        buildTypes {
            debug {
                // The colleague's signing key was not included in the source archive.
                // Keep their installed application available during water testing.
                applicationIdSuffix '.centerexperiment'
            }
        }

        sourceSets {
            main {
                java.srcDirs = ['phonetest']
                assets.srcDirs = ['vision/assets']
                manifest.srcFile 'phonetest/apkv1.xml'
                if (reuseVisionBinary) jniLibs.srcDirs = ['vision/prebuilt']
            }
        }

        if (!reuseVisionBinary) { externalNativeBuild {
            cmake {
                path file('vision/cpp/CMakeLists.txt')
                version '3.31.6'
            }
        } }
    }

    dependencies {
        implementation 'androidx.activity:activity:1.9.3'
        implementation 'androidx.core:core:1.13.1'

        implementation 'androidx.camera:camera-core:1.4.2'
        implementation 'androidx.camera:camera-camera2:1.4.2'
        implementation 'androidx.camera:camera-lifecycle:1.4.2'
        implementation 'androidx.camera:camera-view:1.4.2'
        implementation 'androidx.camera:camera-video:1.4.2'
        implementation 'androidx.camera:camera-effects:1.4.2'

        implementation 'com.github.mik3y:usb-serial-for-android:3.11.0'
    }
}
